<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밥상쌤의 SEL 상차림 · 놀이·질문 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FFFFFF;
    font-family: 'Noto Sans KR', sans-serif;
    color: #3A2E28;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #B23A2E; margin-bottom: 6px; }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.25;
    margin: 0;
  }
  .lead { margin-top: 10px; font-size: 15px; color: #6B5B4E; line-height: 1.6; }

  .panel { background: #FBF9F6; border: 1px solid #EDE5D9; border-radius: 20px; padding: 24px; margin-top: 28px; }
  .label { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #6B5B4E; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    cursor: pointer; border: 1.5px solid #E4DCD2; background: #FBF9F6;
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
    transition: all .15s ease; font-family: inherit;
  }
  .chip:hover { border-color: #B23A2E; }
  .chip.active-situation { background: #3A2E28; color: #FFF9F2; border-color: #3A2E28; }

  .section { margin-bottom: 20px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

  select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid #E4DCD2; background: #FBF9F6; font-family: inherit;
    font-size: 14px; color: #3A2E28; appearance: none;
  }
  select:focus { outline: 2px solid #B23A2E; outline-offset: 1px; }
  label.field-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block; color: #6B5B4E; }

  .serve-btn {
    cursor: pointer; border: none; border-radius: 14px; padding: 16px 28px;
    font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 17px;
    color: #FFF9F2; background: #B23A2E; box-shadow: 0 6px 0 #7C271E;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .serve-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .serve-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #7C271E; }
  .serve-btn:disabled { opacity: .6; cursor: default; }
  .btn-row { text-align: center; margin-top: 22px; }

  .error { max-width: 760px; margin: 20px auto 0; color: #B23A2E; text-align: center; font-size: 14px; }

  .tray { margin-top: 32px; background: linear-gradient(180deg, #EFE3D0 0%, #E6D6BC 100%); border-radius: 28px; padding: 28px 22px; display: none; }
  .tray-title { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 13px; color: #6B5B4E; text-align: center; margin-bottom: 18px; letter-spacing: .12em; }
  .card { background: #FFFDF9; border-radius: 24px; padding: 22px 22px 20px; box-shadow: 0 4px 14px rgba(60,40,20,.08); margin-bottom: 16px; }
  .card-small { background: #FFFDF9; border-radius: 20px; padding: 18px; box-shadow: 0 4px 14px rgba(60,40,20,.08); }
  .card h2 { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 900; margin: 0 0 12px; }
  .card ol { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.75; color: #4A3D33; }
  .card ol li { margin-bottom: 4px; }
  .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .qgrid { grid-template-columns: 1fr; } }
  .quote { text-align: center; padding: 14px 10px 4px; font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 700; color: #6B5B4E; }
  .classic-card { margin-top: 18px; background: #FFFDF9; border-radius: 20px; padding: 22px; text-align: center; box-shadow: 0 4px 14px rgba(60,40,20,.08); }
  .classic-label { font-size: 12px; font-weight: 700; color: #6B5B4E; margin-bottom: 10px; }
  .classic-hanja { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 900; color: #3A2E28; letter-spacing: 1px; margin-bottom: 8px; }
  .classic-meaning { font-size: 14px; color: #4A3D33; line-height: 1.6; margin-bottom: 6px; }
  .classic-source { font-size: 12px; color: #9C8B7A; margin-bottom: 16px; }
  .worksheet-btn { cursor: pointer; border: 1.5px solid #B23A2E; background: #FFFDF9; color: #B23A2E; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 700; }
  .worksheet-btn:hover { background: #B23A2E; color: #FFF9F2; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">밥상쌤의 SEL 상차림</div>
    <h1>오늘 교실에 뭘 차려낼까요?</h1>
    <p class="lead">상황, 영역, 하위기술, 맥락을 고르면 그 자리에서 어울리는 놀이 1가지와 질문 2가지를 새로 지어드려요.</p>

    <div class="panel">
      <div class="section">
        <div class="label">1. 교실 상황</div>
        <div class="chip-row" id="situationRow"></div>
      </div>

      <div class="section">
        <div class="label">2. 사회정서교육 영역</div>
        <div class="chip-row" id="domainRow"></div>
      </div>

      <div class="grid2">
        <div>
          <label class="field-label">3. 하위기술</label>
          <select id="subskillSelect"></select>
        </div>
        <div>
          <label class="field-label">4. 학년군</label>
          <select id="gradeSelect"></select>
        </div>
        <div>
          <label class="field-label">소요시간</label>
          <select id="durationSelect"></select>
        </div>
        <div>
          <label class="field-label">활동형태</label>
          <select id="formatSelect"></select>
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="field-label">놀이 스타일</label>
          <select id="styleSelect"></select>
        </div>
      </div>

      <div class="btn-row">
        <button class="serve-btn" id="serveBtn">🍚 오늘의 상 차려주세요</button>
      </div>
    </div>

    <div class="error" id="errorBox" style="display:none;"></div>

    <div class="tray" id="tray">
      <div class="tray-title" id="trayTitle"></div>
      <div class="card">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <span style="font-size:20px;">🍚</span>
          <span style="font-size:12px; font-weight:700;" id="activityTimeLabel"></span>
        </div>
        <h2 id="activityName"></h2>
        <ol id="activitySteps"></ol>
        <div style="margin-top:12px; display:flex; flex-direction:column; gap:6px;">
          <div style="font-size:13px; color:#6B5B4E;"><strong>✨ 재미포인트</strong> · <span id="funPoint"></span></div>
          <div style="font-size:13px; color:#6B5B4E;"><strong>💛 감동포인트</strong> · <span id="reflectionPoint"></span></div>
        </div>
      </div>
      <div class="qgrid">
        <div class="card-small">
          <div style="font-size:12px; font-weight:700; color:#6B5B4E; margin-bottom:8px;">🥗 오늘의 질문 (자유)</div>
          <p id="questionFree" style="margin:0; font-size:15px; line-height:1.6;"></p>
        </div>
        <div class="card-small">
          <div style="font-size:12px; font-weight:700; margin-bottom:8px;" id="questionSelLabel"></div>
          <p id="questionSel" style="margin:0; font-size:15px; line-height:1.6;"></p>
        </div>
      </div>
      <div class="quote" id="quote"></div>

      <div class="classic-card" id="classicCard" style="display:none;">
        <div class="classic-label">📜 사회정서 동양고전 한마디</div>
        <div class="classic-hanja" id="classicHanja"></div>
        <div class="classic-meaning" id="classicMeaning"></div>
        <div class="classic-source" id="classicSource"></div>
        <button class="worksheet-btn" id="worksheetBtn">✏️ 따라쓰기 학습지 다운로드</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
